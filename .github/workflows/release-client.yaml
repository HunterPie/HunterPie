name: cd/release-client

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: pwsh

jobs:
  build-win-x64:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.get-package-version.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: setup-msbuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: 18.8.2

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: restore-dependencies
        run: |
          msbuild -m /t:Restore
          pip install -r ./Scripts/release/requirements.txt

      - name: build-project
        run: |
          msbuild /p:Configuration=Release /p:Platform=x64 /v:q /nologo
      
      - id: get-package-version
        name: get-package-version
        run: |
          $version = $(python ./Scripts/release/get_version.py ./HunterPie/bin/Release/net10.0-windows7.0)
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: package-release
        run: |
          python ./Scripts/release/package.py ./HunterPie/bin/Release/net10.0-windows7.0
      
      - name: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.get-package-version.outputs.version }}.zip
          path: ./bin/deploy/${{ steps.get-package-version.outputs.version }}.zip

  upload-release:
    runs-on: ubuntu-latest
    needs: build-win-x64
    steps:
      - name: download-artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-win-x64.outputs.release_version  }}.zip
          path: bin/deploy

      - name: upload-package-to-production
        uses: BetaHuhn/do-spaces-action@v2.0.105
        with:
          access_key: ${{ secrets.AWS_ACCESS_KEY }}
          secret_key: ${{ secrets.AWS_SECRET_KEY }}
          space_name: ${{ vars.BUCKET_NAME }} 
          space_region: ${{ vars.BUCKET_REGION }}
          source: bin/deploy
          out_dir: qa/releases
      
      - name: create-github-release-tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-win-x64.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: bin/deploy/${{ needs.build-win-x64.outputs.release_version }}.zip